# Build configuration scoped to the Tauri desktop app.
#
# Directory-scoped: applies only to cargo commands run inside `src-tauri/`, and
# never to the cursor-bridge workspace under `sidecars/cursor-bridge/`. The two
# builds have separate, heavy dependency graphs and must not evict each other's
# artifacts from a shared target directory.

[build]
# Default artifact location. Using the checkout-local `target/` keeps the build
# working on every machine: the previous `F:/target` default was specific to one
# machine and made `cargo check` fail outright on macOS/Linux with
# "path segment contains separator `:`". Machines that want a dedicated cache
# drive can override it per-invocation without touching this file:
#
#   CARGO_TARGET_DIR=D:/target npm run tauri:build
#
# Directory-scoped: applies only to cargo commands run inside `src-tauri/`, and
# never to the cursor-bridge workspace under `sidecars/cursor-bridge/`. The two
# builds have separate, heavy dependency graphs and must not evict each other's
# artifacts from a shared target directory.
target-dir = "target"
