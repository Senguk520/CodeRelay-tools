name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so dependency and rule updates still get picked up on a quiet repo.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust (src-tauri/) is not a CodeQL-supported language.
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Go has to be installed BEFORE `codeql-action/init`, because init injects
      # its own `go` wrapper (the go-tracing shim) so it can record which files
      # actually get compiled. If setup-go runs afterwards, PATH is rewritten to
      # the untraced toolchain and CodeQL sees no Go source, then fails during
      # `database finalize` with "detected code written in Go but this run didn't
      # build any of it" (exit code 32).
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/coderelay-proxy/go.mod
          cache-dependency-path: sidecars/coderelay-proxy/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # The repo has no go.mod at its root; the sidecar is its own module and
      # pulls the vendored CLIProxyAPI copy in through a replace directive.
      - name: Build Go sidecar
        if: matrix.language == 'go'
        working-directory: sidecars/coderelay-proxy
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
